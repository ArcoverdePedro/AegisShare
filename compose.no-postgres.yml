name: aegisshare

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  aegis_share:
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_URL: ${EXTERNAL_DATABASE_URL:?Defina EXTERNAL_DATABASE_URL no arquivo .env}
      REDIS_URL: redis://redis:6379/0
      PORT: ${PORT:-8000}
    ports:
      - "${APP_PORT:-8000}:${PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PORT:-8000}/health/live', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

volumes:
  redis_data:
