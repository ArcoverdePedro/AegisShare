name: Scaffold production-hardening branch

on:
  push:
    branches:
      - feat/production-hardening
    paths:
      - pyproject.toml
      - aegis_share/models.py
      - .github/workflows/branch-scaffold.yml

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      SECRET_KEY: branch-scaffold-only

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/production-hardening

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Resolve dependencies
        run: |
          uv lock
          uv sync --frozen --dev

      - name: Validate Django before migration generation
        run: uv run manage.py check

      - name: Generate migrations
        run: uv run manage.py makemigrations aegis_share --noinput

      - name: Commit generated artifacts
        run: |
          git add uv.lock aegis_share/migrations
          if git diff --cached --quiet; then
            echo "Generated artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: atualiza lock e migrations"
          git push origin HEAD:feat/production-hardening
