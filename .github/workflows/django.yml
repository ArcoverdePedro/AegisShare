name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django checks
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-only-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sincronizar dependencias exatamente pelo lockfile
        run: uv sync --frozen --dev

      - name: Validar configuracao do Django
        run: uv run manage.py check

      - name: Executar testes Django
        run: uv run manage.py test --verbosity 2

      - name: Validar compilacao dos modulos Python
        run: uv run python -m compileall -q aegis_share mysite

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagem de producao
        run: docker build --pull -f dockerfile -t aegisshare:ci .
