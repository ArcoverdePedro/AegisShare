name: Fix webpush branch

on:
  push:
    branches:
      - feat/pwa-webpush

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv and dependencies
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Make push assertion handler-scoped
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/pwa/tests.py')
          text = path.read_text(encoding='utf-8')
          old = '        self.assertNotIn("event.data", body)\n'
          new = (
              '        push_handler = body.split("self.addEventListener(\\\'push\\\'", 1)[1].split(\n'
              '            "self.addEventListener(\\\'notificationclick\\\'", 1\n'
              '        )[0]\n'
              '        self.assertNotIn("event.data", push_handler)\n'
          )
          if old not in text:
              raise SystemExit('expected assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply Ruff fixes
        run: uv run ruff check aegis_share apps mysite --fix

      - name: Remove temporary workflow and commit fixes
        run: |
          rm .github/workflows/fix-webpush-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Web Push test scope and Ruff issues"
          git push origin HEAD:feat/pwa-webpush
