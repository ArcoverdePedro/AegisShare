name: Refresh branch lockfile

on:
  push:
    branches:
      - feat/production-hardening
    paths:
      - pyproject.toml
      - .github/workflows/branch-lock-refresh.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/production-hardening

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Refresh lockfile
        run: uv lock

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: atualiza uv.lock"
          git push origin HEAD:feat/production-hardening
