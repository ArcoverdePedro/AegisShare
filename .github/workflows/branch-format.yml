name: Format production-hardening branch

on:
  push:
    branches:
      - feat/production-hardening
    paths:
      - .github/workflows/branch-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/production-hardening

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install development dependencies
        run: uv sync --frozen --dev

      - name: Apply safe Ruff fixes and formatting
        run: |
          uv run ruff check --fix aegis_share mysite
          uv run ruff format aegis_share mysite

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aegis_share mysite
          git commit -m "style: aplica ruff na feature"
          git push origin HEAD:feat/production-hardening
