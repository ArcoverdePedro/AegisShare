name: Update webpush lockfile

on:
  push:
    branches:
      - feat/pwa-webpush

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Refresh uv.lock
        run: uv lock

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Lock pywebpush dependency"
          git push origin HEAD:feat/pwa-webpush
