asyncapi: 3.0.0
info:
  title: AegisShare HIS - ADT Internal Events
  version: 0.2.0
  description: >-
    Contrato interno para eventos ADT pós-commit e sinais WebSocket de invalidação.
    Não representa API pública e não transporta PHI textual.
channels:
  adtEvents:
    address: internal.adt.events
    messages:
      encounterAdmitted:
        $ref: '#/components/messages/EncounterAdmitted'
      encounterTransferred:
        $ref: '#/components/messages/EncounterTransferred'
      encounterDischarged:
        $ref: '#/components/messages/EncounterDischarged'
      bedOccupied:
        $ref: '#/components/messages/BedOccupied'
      bedReleased:
        $ref: '#/components/messages/BedReleased'
      bedStatusChanged:
        $ref: '#/components/messages/BedStatusChanged'
  bedMapInvalidation:
    address: /ws/clinical/adt/bed-map/
    description: >-
      WebSocket autenticado por sessão. O servidor revalida a autorização antes
      de cada envio e o cliente refaz GET /leitos/mapa/ para renderização autorizada.
      O navegador recebe somente metadados técnicos mínimos do evento.
    messages:
      invalidation:
        $ref: '#/components/messages/BedMapInvalidation'
operations:
  publishAdtEvent:
    action: send
    channel:
      $ref: '#/channels/adtEvents'
  publishBedMapInvalidation:
    action: send
    channel:
      $ref: '#/channels/bedMapInvalidation'
components:
  schemas:
    BaseEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - occurred_at
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
    EncounterEventPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          additionalProperties: false
          required:
            - encounter_id
            - admission_id
          properties:
            encounter_id:
              type: string
              format: uuid
            admission_id:
              type: string
              format: uuid
            occupancy_id:
              type:
                - string
                - 'null'
              format: uuid
            bed_id:
              type:
                - string
                - 'null'
              format: uuid
            location_id:
              type:
                - string
                - 'null'
              format: uuid
    BedEventPayload:
      allOf:
        - $ref: '#/components/schemas/BaseEvent'
        - type: object
          additionalProperties: false
          required:
            - bed_id
            - location_id
            - state
          properties:
            bed_id:
              type: string
              format: uuid
            location_id:
              type: string
              format: uuid
            state:
              type: string
              enum:
                - AVAILABLE
                - OCCUPIED
                - BLOCKED
                - OUT_OF_SERVICE
    BedMapInvalidationPayload:
      type: object
      additionalProperties: false
      required:
        - type
        - event_id
        - event_type
        - occurred_at
        - location_id
      properties:
        type:
          type: string
          const: adt_event
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - encounter.admitted
            - encounter.transferred
            - encounter.discharged
            - bed.occupied
            - bed.released
            - bed.status_changed
        occurred_at:
          type: string
          format: date-time
        bed_id:
          type:
            - string
            - 'null'
          format: uuid
        location_id:
          type: string
          format: uuid
        state:
          type:
            - string
            - 'null'
  messages:
    EncounterAdmitted:
      name: encounter.admitted
      payload:
        $ref: '#/components/schemas/EncounterEventPayload'
    EncounterTransferred:
      name: encounter.transferred
      payload:
        $ref: '#/components/schemas/EncounterEventPayload'
    EncounterDischarged:
      name: encounter.discharged
      payload:
        $ref: '#/components/schemas/EncounterEventPayload'
    BedOccupied:
      name: bed.occupied
      payload:
        $ref: '#/components/schemas/BedEventPayload'
    BedReleased:
      name: bed.released
      payload:
        $ref: '#/components/schemas/BedEventPayload'
    BedStatusChanged:
      name: bed.status_changed
      payload:
        $ref: '#/components/schemas/BedEventPayload'
    BedMapInvalidation:
      title: Invalidação autorizada do mapa de leitos
      payload:
        $ref: '#/components/schemas/BedMapInvalidationPayload'
