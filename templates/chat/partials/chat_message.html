{% if message.sender_id == request.user.id %}
<div class="chat-message chat-message--sent"
     data-message-id="{{ message.id }}"
     data-sender-id="{{ message.sender_id }}">
    <div class="chat-message__content">{{ message.content }}</div>
    <div class="chat-message__meta">Você · {{ message.created_at|date:"d/m/Y H:i" }}</div>
</div>
{% else %}
<div class="chat-message chat-message--received"
     data-message-id="{{ message.id }}"
     data-sender-id="{{ message.sender_id }}">
    <div class="chat-message__content">{{ message.content }}</div>
    <div class="chat-message__meta">{{ message.sender.username }} · {{ message.created_at|date:"d/m/Y H:i" }}</div>
</div>
{% endif %}
