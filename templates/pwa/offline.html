<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#363636">
    <title>Sem conexão · AegisShare</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f5f7fb;
            --surface: #ffffff;
            --text: #232833;
            --muted: #667085;
            --border: #e3e8ef;
            --accent: #485fc7;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #11141a;
                --surface: #181c24;
                --text: #f1f3f7;
                --muted: #a8b0bd;
                --border: #2a303b;
                --accent: #8fa2ff;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 560px);
            padding: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, .12);
        }
        .mark { font-size: 2rem; line-height: 1; }
        h1 { margin: 1rem 0 .75rem; font-size: clamp(1.6rem, 5vw, 2.2rem); }
        p { color: var(--muted); line-height: 1.6; }
        .notice {
            margin-top: 1.25rem;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: .92rem;
        }
        button {
            margin-top: 1.5rem;
            min-height: 44px;
            padding: .75rem 1rem;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <div class="mark" aria-hidden="true">🛡️</div>
    <h1>Você está sem conexão</h1>
    <p>O AegisShare não mantém prontuários, arquivos ou outras páginas autenticadas em cache. Assim que a conexão voltar, tente novamente para consultar os dados atuais e revalidar suas permissões.</p>
    <div class="notice" role="status">
        Nenhum dado clínico identificável é exibido nesta tela offline.
    </div>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
</main>
</body>
</html>
